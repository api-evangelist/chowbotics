description: Chowbotics was a food-robotics company known for "Sally," a fresh-food and salad
  vending robot that assembled customized bowls on demand for cafeterias, hospitals, campuses,
  and grocery locations. The company was acquired by DoorDash in early 2021 and no longer
  operates as a standalone business; its domain (chowbotics.com) now redirects to DoorDash
  (get.doordash.com). As of this enrichment pass Chowbotics publishes no independent developer
  portal, API documentation, OpenAPI definition, SDKs, or other machine-readable developer
  surface, so this remains an identity-only record in the API Evangelist network rather than an
  active API provider profile.
